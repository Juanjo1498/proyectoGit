name: Prueba Runner

on:
  push:

jobs:
  comprobar:
    runs-on: self-hosted

    steps:
      - name: Comprobar DEV_TOKEN
        run: |
          if [ "$DEV_TOKEN" = "$LOCAL_DEV_TOKEN" ]; then
            echo "Coinciden"
          else
            echo "No coinciden"
            exit 1
          fi
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
          LOCAL_DEV_TOKEN: ${{ vars.LOCAL_DEV_TOKEN }}

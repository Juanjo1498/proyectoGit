name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Actualizar README
        run: echo "Feature añadida" >> README.md

  validate-dev:
    runs-on: ubuntu-latest
    needs: update-readme

    steps:
      - name: Validar token DEV
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if [ "$DEV_TOKEN" = "correcto" ]; then
            echo "Token correcto"
          else
            echo "Token incorrecto"
            exit 1
          fi
